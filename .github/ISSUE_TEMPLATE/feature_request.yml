name: 功能建议
description: 描述校园场景与希望改善的操作
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 当前操作和希望怎样改善
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 可公开验证的官方资料（如有）
      description: 不提供个人认证链接、Cookie 或密码。
